# Builds the TwinCAT Packaging Guide with Zensical and publishes the site folder to GitHub Pages.
# The repository's Pages setting has to be "Source: GitHub Actions" for the deploy step to work.
# Follows the workflow in the Zensical documentation (https://zensical.org/docs/publish-your-site/),
# with --strict added so that a broken link fails the build instead of going live.
name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.52
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
