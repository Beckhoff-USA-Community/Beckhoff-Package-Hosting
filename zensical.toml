[project]
site_name = "TwinCAT Packaging Guide"
site_description = "How to build TwinCAT Package Manager packages and workloads by hand, and host them on a folder feed, GitHub Packages or Nexus"
extra_css = ["stylesheets/extra.css"]
# The site is read from disk or from "zensical serve", not from a web server,
# so every page is written as a plain .html file that a file:// link reaches.
use_directory_urls = false
nav = [
  { "Home" = "index.md" },
  { "Building a package" = [
    { "The folder and the nuspec" = "packages/nuspec.md" },
    { "Install, upgrade and uninstall" = "packages/scripts.md" },
    { "Versioning" = "packages/versioning.md" },
    { "Packing and testing" = "packages/packing.md" },
    { "Workloads" = "packages/workloads.md" },
  ] },
  { "Examples" = [
    { "PLC library" = "examples/plc-library.md" },
    { ".NET service" = "examples/dotnet-service.md" },
    { "Plain files" = "examples/files.md" },
  ] },
  { "Hosting" = [
    { "Hosting packages" = "hosting/index.md" },
    { "Signature verification" = "hosting/signatures.md" },
    { "A folder on disk" = "hosting/folder.md" },
    { "GitHub Packages" = "hosting/github.md" },
    { "Nexus" = "hosting/nexus.md" },
  ] },
  { "Pitfalls" = "pitfalls.md" },
  { "Self-hosting other packages" = [
    { "Overview" = "self-hosting/index.md" },
    { "Package building for RT Linux" = "self-hosting/rt-linux-building.md" },
    { "Client package usage on RT Linux" = "self-hosting/rt-linux-clients.md" },
    { "Package building for TwinCAT/BSD" = "self-hosting/tcbsd-building.md" },
    { "Client package usage on TwinCAT/BSD" = "self-hosting/tcbsd-clients.md" },
    { "Docker images" = "self-hosting/docker.md" },
  ] },
]

[project.theme]
variant = "classic"
font.text = "Inter"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
